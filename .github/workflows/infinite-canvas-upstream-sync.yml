name: Sync Infinite Canvas Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: infinite-canvas-upstream-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      update_sha: ${{ steps.update_branch.outputs.update_sha }}
      pr_number: ${{ steps.pull_request.outputs.pr_number }}
    env:
      UPDATE_BRANCH: automation/infinite-canvas-upstream
      CANVAS_REPOSITORY: basketikun/infinite-canvas
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Read Infinite Canvas published release
        id: canvas_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          INFINITE_CANVAS_RELEASE_TAG="$(gh api "repos/${CANVAS_REPOSITORY}/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)"
          echo "INFINITE_CANVAS_RELEASE_TAG=$INFINITE_CANVAS_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "tag=$INFINITE_CANVAS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Infinite Canvas published release: ${INFINITE_CANVAS_RELEASE_TAG:-none}"

      - name: Detect upstream update
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD:integrations/infinite-canvas)"
          RELEASE_TAG="${{ steps.canvas_release.outputs.tag }}"
          if [[ -n "$RELEASE_TAG" ]]; then
            git -C integrations/infinite-canvas fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            LATEST_SHA="$(git -C integrations/infinite-canvas rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          else
            git -C integrations/infinite-canvas fetch --depth=1 origin main
            LATEST_SHA="$(git -C integrations/infinite-canvas rev-parse FETCH_HEAD)"
          fi
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$CURRENT_SHA" == "$LATEST_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Infinite Canvas upstream is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C integrations/infinite-canvas checkout --detach "$LATEST_SHA"
            echo "Infinite Canvas update: $CURRENT_SHA -> $LATEST_SHA"
          fi

      - name: Setup Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Verify adapter against updated upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-infinite-canvas-patches.mjs --root integrations/infinite-canvas
          pushd integrations/infinite-canvas/web
          bun install --frozen-lockfile
          VITE_BASE=/canvas-app/ bun run typecheck
          VITE_BASE=/canvas-app/ bun run build
          cp ../VERSION dist/version.txt
          popd
          git -C integrations/infinite-canvas reset --hard "${{ steps.upstream.outputs.latest_sha }}"
          git -C integrations/infinite-canvas clean -f -- web/src/lib/sub2-bridge.ts
          test -z "$(git -C integrations/infinite-canvas status --short)"

      - name: Run integration contract tests
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-sub2-infinite-canvas-integration.mjs --root . --check
          node --test scripts/__tests__/infinite-canvas-integration.test.mjs scripts/__tests__/infinite-canvas-workflows.test.mjs

      - name: Create update branch
        id: update_branch
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$UPDATE_BRANCH"
          git add integrations/infinite-canvas
          git commit -m "chore: update Infinite Canvas upstream to ${{ steps.upstream.outputs.latest_sha }}"
          UPDATE_SHA="$(git rev-parse HEAD)"
          git push --force origin "$UPDATE_BRANCH"
          echo "update_sha=$UPDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: pull_request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: 自动同步 Infinite Canvas 上游" \
              --body "自动更新 Infinite Canvas 子模块。适配补丁、TypeScript 检查和生产构建已通过；合并仍受仓库完整 CI 门禁保护。"
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          test -n "$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  full-ci:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ needs.update.outputs.update_sha }}

  merge:
    needs: [update, full-ci]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge verified Infinite Canvas update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
          PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [[ "$PR_STATE" != "MERGED" ]]; then
            echo "Infinite Canvas update pull request was not merged: $PR_STATE" >&2
            exit 1
          fi

  dispatch-release:
    needs: [update, full-ci, merge]
    if: ${{ always() && needs.update.result == 'success' && (needs.update.outputs.changed == 'false' || (needs.update.outputs.changed == 'true' && needs.full-ci.result == 'success' && needs.merge.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unified upstream release sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run upstream-theme-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f repository_release=false \
            -f scheduled_round=true
