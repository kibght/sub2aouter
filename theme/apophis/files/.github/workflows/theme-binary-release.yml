name: Publish Themed Binary Release

on:
  workflow_run:
    workflows:
      - Sync Upstream With Apophis Theme
    types:
      - completed

permissions:
  contents: write

jobs:
  binary-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: themed-release
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Prepare unique release version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(date -u +%Y).$(date -u +%-m).${{ github.event.workflow_run.run_number }}"
          echo "$RELEASE_VERSION" > backend/cmd/server/VERSION
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          git tag -f "v$RELEASE_VERSION"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish --skip=validate --config=.goreleaser.theme.yaml
      - name: Publish GitHub binary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target themed-release \
            --title "Sub2Aouter $RELEASE_VERSION" \
            --notes "Apophis themed binary release generated from upstream and main theme revision ${{ github.event.workflow_run.head_sha }}." \
            --latest
