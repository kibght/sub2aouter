name: Make GHCR Image Public

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Make container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --request PATCH \
            --url https://api.github.com/user/packages/container/sub2aouter \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"visibility":"public"}'