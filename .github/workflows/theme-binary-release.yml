name: Publish Themed Binary Release

on:
  workflow_call:
    inputs:
      release_ref:
        description: Immutable generated release commit to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: Generated release branch, tag, or commit to build
        required: false
        default: themed-release
        type: string

concurrency:
  group: themed-binary-release-${{ inputs.release_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      release_exists: ${{ steps.release.outputs.release_exists }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_ref || 'themed-release' }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify themed release matches main repository and canvas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          MAIN_REPOSITORY_SHA="$(git rev-parse FETCH_HEAD)"
          RELEASE_REPOSITORY_SHA="$(tr -d '[:space:]' < .apophis-repository-sha)"
          MAIN_CANVAS_SHA="$(git rev-parse "${MAIN_REPOSITORY_SHA}:integrations/infinite-canvas")"
          RELEASE_CANVAS_SHA="$(git rev-parse HEAD:integrations/infinite-canvas)"
          CANVAS_RELEASE_TAG="$(gh api repos/basketikun/infinite-canvas/releases/latest --jq '.tag_name // ""')"
          test -n "$CANVAS_RELEASE_TAG"
          git -C integrations/infinite-canvas fetch --depth=1 origin "refs/tags/${CANVAS_RELEASE_TAG}:refs/tags/${CANVAS_RELEASE_TAG}"
          LATEST_CANVAS_SHA="$(git -C integrations/infinite-canvas rev-list -n 1 "refs/tags/${CANVAS_RELEASE_TAG}")"
          if [[ "$RELEASE_CANVAS_SHA" != "$LATEST_CANVAS_SHA" ]]; then
            echo "Themed release Canvas SHA is behind the latest upstream release: $RELEASE_CANVAS_SHA != $LATEST_CANVAS_SHA ($CANVAS_RELEASE_TAG)" >&2
            exit 1
          fi
          if [[ "$RELEASE_REPOSITORY_SHA" != "$MAIN_REPOSITORY_SHA" ]]; then
            echo "Themed release repository SHA is stale: $RELEASE_REPOSITORY_SHA != $MAIN_REPOSITORY_SHA" >&2
            exit 1
          fi
          if [[ "$RELEASE_CANVAS_SHA" != "$MAIN_CANVAS_SHA" ]]; then
            echo "Themed release Canvas SHA is stale: $RELEASE_CANVAS_SHA != $MAIN_CANVAS_SHA" >&2
            exit 1
          fi

      - name: Read release version and inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid themed release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          RELEASE_TAG="v${RELEASE_VERSION}"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

          REQUIRED_ASSETS=(
            "sub2api_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "sub2api_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "sub2api_${RELEASE_VERSION}_windows_amd64.zip"
            "sub2api_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "sub2api_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "checksums.txt"
            "release-descriptor.json"
          )

          resolve_tag_commit() {
            local object_json object_type object_sha
            object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(jq -r '.object.type' <<< "$object_json")"
            object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            while [[ "$object_type" == "tag" ]]; do
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "$object_json")"
              object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            done
            [[ "$object_type" == "commit" ]] || {
              echo "Release tag ${RELEASE_TAG} resolves to unsupported object type ${object_type}." >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          verify_release_assets() {
            local asset_dir="$1"
            (
              cd "$asset_dir"
              for asset in "${REQUIRED_ASSETS[@]}"; do
                test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
              done
              [[ "$(jq -r '.releaseVersion' release-descriptor.json)" == "$RELEASE_VERSION" ]]
              [[ "$(jq -r '.releaseTag' release-descriptor.json)" == "$RELEASE_TAG" ]]
              [[ "$(jq -r '.releaseCommit' release-descriptor.json)" == "$RELEASE_COMMIT" ]]
              [[ "$(jq -r '.checksumsSha256' release-descriptor.json)" == "$(sha256sum checksums.txt | awk '{print $1}')" ]]
              sha256sum --check checksums.txt
            )
          }

          RELEASE_EXISTS=false
          RELEASE_JSON_FILE=/tmp/apophis-release.json
          RELEASE_ERROR_FILE=/tmp/apophis-release-error.log
          set +e
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,targetCommitish > "$RELEASE_JSON_FILE" 2> "$RELEASE_ERROR_FILE"
          RELEASE_STATUS=$?
          set -e
          if [[ "$RELEASE_STATUS" -eq 0 ]]; then
            RELEASE_EXISTS=true
            RELEASE_DRAFT="$(jq -r '.isDraft' "$RELEASE_JSON_FILE")"
            RELEASE_PRERELEASE="$(jq -r '.isPrerelease' "$RELEASE_JSON_FILE")"
            RELEASE_TARGET="$(jq -r '.targetCommitish' "$RELEASE_JSON_FILE")"
            RELEASE_ASSETS="$(jq -r '.assets[].name' "$RELEASE_JSON_FILE")"
            MISSING_ASSETS=()
            for asset in "${REQUIRED_ASSETS[@]}"; do
              if ! grep -Fqx -- "$asset" <<< "$RELEASE_ASSETS"; then
                MISSING_ASSETS+=("$asset")
              fi
            done

            REMOTE_TAG_COMMIT=""
            TAG_ERROR_FILE=/tmp/apophis-release-tag-error.log
            set +e
            REMOTE_TAG_COMMIT="$(resolve_tag_commit 2> "$TAG_ERROR_FILE")"
            TAG_STATUS=$?
            set -e
            if [[ "$TAG_STATUS" -ne 0 ]] && ! grep -Eiq '404|not found' "$TAG_ERROR_FILE"; then
              cat "$TAG_ERROR_FILE" >&2
              exit "$TAG_STATUS"
            fi
            if [[ -n "$REMOTE_TAG_COMMIT" && "$REMOTE_TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
              echo "Release tag ${RELEASE_TAG} points to ${REMOTE_TAG_COMMIT}, expected ${RELEASE_COMMIT}; refusing to move an immutable tag." >&2
              exit 1
            fi

            ASSET_STATUS=1
            if [[ "${#MISSING_ASSETS[@]}" -eq 0 ]]; then
              EXISTING_ASSET_DIR=/tmp/apophis-existing-release-assets
              rm -rf "$EXISTING_ASSET_DIR"
              mkdir -p "$EXISTING_ASSET_DIR"
              set +e
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$EXISTING_ASSET_DIR" --clobber
              DOWNLOAD_STATUS=$?
              if [[ "$DOWNLOAD_STATUS" -eq 0 ]]; then
                verify_release_assets "$EXISTING_ASSET_DIR"
                ASSET_STATUS=$?
              else
                ASSET_STATUS=$DOWNLOAD_STATUS
              fi
              set -e
            fi

            if [[ "$RELEASE_DRAFT" == "false" && "$RELEASE_PRERELEASE" == "false" && "$RELEASE_TARGET" == "$RELEASE_COMMIT" && "$REMOTE_TAG_COMMIT" == "$RELEASE_COMMIT" && "${#MISSING_ASSETS[@]}" -eq 0 && "$ASSET_STATUS" -eq 0 ]]; then
              echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
              echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG already matches commit $RELEASE_COMMIT and all asset checksums; nothing to publish."
              exit 0
            fi
            echo "Existing release ${RELEASE_TAG} needs repair (draft=${RELEASE_DRAFT}, prerelease=${RELEASE_PRERELEASE}, target=${RELEASE_TARGET}, tag=${REMOTE_TAG_COMMIT:-missing}, missing=${MISSING_ASSETS[*]:-none}, asset_status=${ASSET_STATUS})."
          elif grep -Eiq '404|not found' "$RELEASE_ERROR_FILE"; then
            echo "Release $RELEASE_TAG does not exist; creating it."
          else
            cat "$RELEASE_ERROR_FILE" >&2
            exit "$RELEASE_STATUS"
          fi
          echo "RELEASE_EXISTS=$RELEASE_EXISTS" >> "$GITHUB_ENV"
          echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: env.SHOULD_PUBLISH == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.SHOULD_PUBLISH == 'true'
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.SHOULD_PUBLISH == 'true'
        with:
          bun-version: 1.3.13

      - run: pnpm install --frozen-lockfile
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: frontend

      - run: pnpm run build
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: frontend

      - name: Build Infinite Canvas
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-infinite-canvas-patches.mjs --root integrations/infinite-canvas
          cd integrations/infinite-canvas/web
          bun install --frozen-lockfile
          VITE_BASE=/canvas-app/ bun run typecheck
          VITE_BASE=/canvas-app/ bun run build
          cp ../VERSION dist/version.txt
          cd ../../..
          mkdir -p backend/internal/web/dist/canvas-app
          cp -a integrations/infinite-canvas/web/dist/. backend/internal/web/dist/canvas-app/

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: env.SHOULD_PUBLISH == 'true'
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: env.SHOULD_PUBLISH == 'true'
        with:
          version: '~> v2'
          args: release --clean --skip=publish --skip=validate --config=.goreleaser.theme.yaml

      - name: Verify GoReleaser artifacts
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            "dist/sub2api_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "dist/sub2api_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            "dist/sub2api_${RELEASE_VERSION}_windows_amd64.zip" \
            "dist/sub2api_${RELEASE_VERSION}_darwin_amd64.tar.gz" \
            "dist/sub2api_${RELEASE_VERSION}_darwin_arm64.tar.gz"; do
            test -s "$artifact" || { echo "Missing release artifact: $artifact" >&2; exit 1; }
          done
          test -s dist/checksums.txt

      - name: Create immutable release descriptor
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg checksumsSha256 "$(sha256sum dist/checksums.txt | awk '{print $1}')" \
            '{
              releaseVersion: $releaseVersion,
              releaseTag: $releaseTag,
              releaseCommit: $releaseCommit,
              checksumsSha256: $checksumsSha256
            }' > dist/release-descriptor.json
          jq -e \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            '.releaseVersion == $releaseVersion and .releaseTag == $releaseTag and .releaseCommit == $releaseCommit' \
            dist/release-descriptor.json >/dev/null

      - name: Package verified binary artifacts
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/binary-artifacts"
          PAYLOAD_DIR="$OUTPUT_DIR/payload"
          mkdir -p "$PAYLOAD_DIR"
          cp .apophis-release-title .apophis-release-notes.md "$PAYLOAD_DIR/"
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt dist/release-descriptor.json "$PAYLOAD_DIR/"
          tar -czf "$OUTPUT_DIR/release-assets.tar.gz" -C "$PAYLOAD_DIR" .
          (
            cd "$OUTPUT_DIR"
            sha256sum release-assets.tar.gz > binary-artifacts.sha256
          )

      - name: Upload verified binary artifacts
        if: env.SHOULD_PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-binary-artifacts
          path: |
            ${{ runner.temp }}/binary-artifacts/release-assets.tar.gz
            ${{ runner.temp }}/binary-artifacts/binary-artifacts.sha256
          if-no-files-found: error
          retention-days: 1


  publish-release:
    needs: build-artifacts
    if: needs.build-artifacts.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_EXISTS: ${{ needs.build-artifacts.outputs.release_exists }}
      RELEASE_VERSION: ${{ needs.build-artifacts.outputs.release_version }}
      RELEASE_TAG: ${{ needs.build-artifacts.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.release_commit }}
      ASSET_DIR: /tmp/release-assets
    steps:
      - name: Download verified binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-binary-artifacts
          path: ${{ runner.temp }}/binary-artifacts

      - name: Verify and extract binary artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/binary-artifacts"
          sha256sum --check binary-artifacts.sha256
          mkdir -p "$ASSET_DIR"
          tar -xzf release-assets.tar.gz -C "$ASSET_DIR"
          test -s "$ASSET_DIR/.apophis-release-title"
          test -s "$ASSET_DIR/.apophis-release-notes.md"
          for artifact in \
            "$ASSET_DIR/sub2api_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "$ASSET_DIR/sub2api_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            "$ASSET_DIR/sub2api_${RELEASE_VERSION}_windows_amd64.zip" \
            "$ASSET_DIR/sub2api_${RELEASE_VERSION}_darwin_amd64.tar.gz" \
            "$ASSET_DIR/sub2api_${RELEASE_VERSION}_darwin_arm64.tar.gz" \
            "$ASSET_DIR/checksums.txt" \
            "$ASSET_DIR/release-descriptor.json"; do
            test -s "$artifact" || { echo "Missing release artifact: $artifact" >&2; exit 1; }
          done
          [[ "$(jq -r '.releaseVersion' "$ASSET_DIR/release-descriptor.json")" == "$RELEASE_VERSION" ]]
          [[ "$(jq -r '.releaseTag' "$ASSET_DIR/release-descriptor.json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.releaseCommit' "$ASSET_DIR/release-descriptor.json")" == "$RELEASE_COMMIT" ]]
          [[ "$(jq -r '.checksumsSha256' "$ASSET_DIR/release-descriptor.json")" == "$(sha256sum "$ASSET_DIR/checksums.txt" | awk '{print $1}')" ]]
          (
            cd "$ASSET_DIR"
            sha256sum --check checksums.txt
          )

      - name: Publish GitHub binary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TITLE="$(cat "$ASSET_DIR/.apophis-release-title")"
          if [[ -z "$RELEASE_TITLE" || ! -s "$ASSET_DIR/.apophis-release-notes.md" ]]; then
            echo "Generated release title or notes are missing." >&2
            exit 1
          fi

          resolve_tag_commit() {
            local object_json object_type object_sha
            object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(jq -r '.object.type' <<< "$object_json")"
            object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            while [[ "$object_type" == "tag" ]]; do
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "$object_json")"
              object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            done
            [[ "$object_type" == "commit" ]]
            printf '%s\n' "$object_sha"
          }

          REMOTE_TAG_COMMIT=""
          TAG_ERROR_FILE=/tmp/apophis-publish-tag-error.log
          set +e
          REMOTE_TAG_COMMIT="$(resolve_tag_commit 2> "$TAG_ERROR_FILE")"
          TAG_STATUS=$?
          set -e
          if [[ "$TAG_STATUS" -ne 0 ]] && ! grep -Eiq '404|not found' "$TAG_ERROR_FILE"; then
            cat "$TAG_ERROR_FILE" >&2
            exit "$TAG_STATUS"
          fi
          if [[ -n "$REMOTE_TAG_COMMIT" && "$REMOTE_TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "Release tag ${RELEASE_TAG} points to ${REMOTE_TAG_COMMIT}, expected ${RELEASE_COMMIT}; refusing to move an immutable tag." >&2
            exit 1
          fi
          if [[ "$RELEASE_EXISTS" == "true" && -z "$REMOTE_TAG_COMMIT" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_COMMIT" >/dev/null
          fi

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$RELEASE_TAG" \
              "$ASSET_DIR"/*.tar.gz "$ASSET_DIR"/*.zip "$ASSET_DIR/checksums.txt" "$ASSET_DIR/release-descriptor.json" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file "$ASSET_DIR/.apophis-release-notes.md" \
              --latest \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              "$ASSET_DIR"/*.tar.gz "$ASSET_DIR"/*.zip "$ASSET_DIR/checksums.txt" "$ASSET_DIR/release-descriptor.json" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file "$ASSET_DIR/.apophis-release-notes.md" \
              --latest
          fi

      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON_FILE=/tmp/apophis-published-release.json
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,targetCommitish > "$RELEASE_JSON_FILE"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Unable to read published release ${RELEASE_TAG}." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          test "$(jq -r '.isDraft' "$RELEASE_JSON_FILE")" = "false"
          test "$(jq -r '.isPrerelease' "$RELEASE_JSON_FILE")" = "false"
          test "$(jq -r '.targetCommitish' "$RELEASE_JSON_FILE")" = "$RELEASE_COMMIT"
          PUBLISHED_ASSETS="$(jq -r '.assets[].name' "$RELEASE_JSON_FILE")"
          REQUIRED_ASSETS=(
            "sub2api_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "sub2api_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "sub2api_${RELEASE_VERSION}_windows_amd64.zip"
            "sub2api_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "sub2api_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "checksums.txt"
            "release-descriptor.json"
          )
          for asset in "${REQUIRED_ASSETS[@]}"; do
            grep -Fqx -- "$asset" <<< "$PUBLISHED_ASSETS" || {
              echo "Missing published release asset: $asset" >&2
              exit 1
            }
          done

          resolve_tag_commit() {
            local object_json object_type object_sha
            object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(jq -r '.object.type' <<< "$object_json")"
            object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            while [[ "$object_type" == "tag" ]]; do
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "$object_json")"
              object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            done
            [[ "$object_type" == "commit" ]]
            printf '%s\n' "$object_sha"
          }
          REMOTE_TAG_COMMIT="$(resolve_tag_commit)"
          [[ "$REMOTE_TAG_COMMIT" == "$RELEASE_COMMIT" ]]

          PUBLISHED_ASSET_DIR=/tmp/apophis-published-release-assets
          rm -rf "$PUBLISHED_ASSET_DIR"
          mkdir -p "$PUBLISHED_ASSET_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$PUBLISHED_ASSET_DIR" --clobber
          [[ "$(jq -r '.releaseVersion' "$PUBLISHED_ASSET_DIR/release-descriptor.json")" == "$RELEASE_VERSION" ]]
          [[ "$(jq -r '.releaseTag' "$PUBLISHED_ASSET_DIR/release-descriptor.json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.releaseCommit' "$PUBLISHED_ASSET_DIR/release-descriptor.json")" == "$RELEASE_COMMIT" ]]
          [[ "$(jq -r '.checksumsSha256' "$PUBLISHED_ASSET_DIR/release-descriptor.json")" == "$(sha256sum "$PUBLISHED_ASSET_DIR/checksums.txt" | awk '{print $1}')" ]]
          (
            cd "$PUBLISHED_ASSET_DIR"
            sha256sum --check checksums.txt
          )
