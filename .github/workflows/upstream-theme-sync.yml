name: Sync Upstream With Apophis Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit
        required: false
        default: main
        type: string
  schedule:
    - cron: '30 19 * * *'

concurrency:
  group: upstream-theme-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync-build-publish:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPOSITORY: https://github.com/Wei-Shaw/sub2api.git
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
      GENERATED_DIR: ${{ runner.temp }}/sub2api-themed-release

    steps:
      - name: Checkout theme source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream source
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --depth=1 upstream "$UPSTREAM_REF"
          git worktree add --detach "$GENERATED_DIR" FETCH_HEAD
          echo "UPSTREAM_SHA=$(git -C "$GENERATED_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy permanent theme source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GENERATED_DIR/theme" "$GENERATED_DIR/scripts" "$GENERATED_DIR/.github/workflows"
          cp -a theme/. "$GENERATED_DIR/theme/"
          cp -a scripts/. "$GENERATED_DIR/scripts/"
          cp THEME.md "$GENERATED_DIR/THEME.md"
          cp .github/workflows/upstream-theme-sync.yml "$GENERATED_DIR/.github/workflows/upstream-theme-sync.yml"

      - name: Apply theme overlay
        run: node scripts/apply-theme.mjs --root .
        working-directory: ${{ env.GENERATED_DIR }}

      - name: Verify theme overlay and UTF-8
        shell: bash
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          set -euo pipefail
          node scripts/apply-theme.mjs --root . --check
          node scripts/check-encoding.mjs .
          node --test scripts/__tests__/*.test.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.GENERATED_DIR }}/frontend

      - name: Frontend lint and typecheck
        shell: bash
        working-directory: ${{ env.GENERATED_DIR }}/frontend
        run: |
          set -euo pipefail
          pnpm run lint:check
          pnpm run typecheck

      - name: Frontend regression tests
        shell: bash
        working-directory: ${{ env.GENERATED_DIR }}/frontend
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/views/__tests__/HomeView.spec.ts \
            src/views/auth/__tests__/LinuxDoCallbackView.spec.ts \
            src/views/auth/__tests__/WechatCallbackView.spec.ts \
            src/views/user/__tests__/PaymentView.spec.ts \
            src/views/user/__tests__/PaymentResultView.spec.ts \
            src/components/user/profile/__tests__/ProfileInfoCard.spec.ts \
            src/views/admin/__tests__/SettingsView.spec.ts

      - name: Build frontend
        run: pnpm run build
        working-directory: ${{ env.GENERATED_DIR }}/frontend

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GENERATED_DIR }}/backend/go.mod
          cache: false

      - name: Backend unit tests
        run: make test-unit
        working-directory: ${{ env.GENERATED_DIR }}/backend

      - name: Build immutable themed image
        shell: bash
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${UPSTREAM_SHA:0:12}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${UPSTREAM_SHA}" \
            -t "${IMAGE}:upstream-${SHORT_SHA}" \
            .

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push immutable themed image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${UPSTREAM_SHA:0:12}"
          docker push "${IMAGE}:upstream-${SHORT_SHA}"

      - name: Update generated release branch
        shell: bash
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          set -euo pipefail
          git switch -C themed-release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "chore: sync upstream ${UPSTREAM_SHA} with apophis theme" || true
          git push origin HEAD:themed-release --force

      - name: Publish latest image after release branch succeeds
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${UPSTREAM_SHA:0:12}"
          docker tag "${IMAGE}:upstream-${SHORT_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"