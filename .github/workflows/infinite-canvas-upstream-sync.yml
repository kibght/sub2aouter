name: Sync Infinite Canvas Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: infinite-canvas-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_BRANCH: automation/infinite-canvas-upstream
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Detect upstream update
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD:integrations/infinite-canvas)"
          git -C integrations/infinite-canvas fetch --depth=1 origin main
          LATEST_SHA="$(git -C integrations/infinite-canvas rev-parse FETCH_HEAD)"
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$CURRENT_SHA" == "$LATEST_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Infinite Canvas 上游没有新提交。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C integrations/infinite-canvas checkout --detach "$LATEST_SHA"
            echo "检测到 Infinite Canvas 更新：$CURRENT_SHA -> $LATEST_SHA"
          fi

      - name: Setup Bun
        if: steps.upstream.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Verify adapter against updated upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-infinite-canvas-patches.mjs --root integrations/infinite-canvas
          cd integrations/infinite-canvas/web
          bun install --frozen-lockfile
          VITE_BASE=/canvas-app/ bun run typecheck
          VITE_BASE=/canvas-app/ bun run build
          cp ../VERSION dist/version.txt
          cd ../..
          git -C integrations/infinite-canvas reset --hard "${{ steps.upstream.outputs.latest_sha }}"
          git -C integrations/infinite-canvas clean -f -- web/src/lib/sub2-bridge.ts
          test -z "$(git -C integrations/infinite-canvas status --short)"

      - name: Run integration contract tests
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-sub2-infinite-canvas-integration.mjs --root . --check
          node --test scripts/__tests__/infinite-canvas-integration.test.mjs scripts/__tests__/infinite-canvas-workflows.test.mjs

      - name: Create update branch
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$UPDATE_BRANCH"
          git add integrations/infinite-canvas
          git commit -m "chore: update Infinite Canvas upstream to ${{ steps.upstream.outputs.latest_sha }}"
          git push --force origin "$UPDATE_BRANCH"

      - name: Create or update pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: 自动同步 Infinite Canvas 上游" \
              --body "自动更新 Infinite Canvas 子模块。适配补丁、TypeScript 检查和生产构建已通过；合并仍受仓库完整 CI 门禁保护。"
            PR_NUMBER="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          if ! gh pr merge --auto --squash "$PR_NUMBER"; then
            echo "Auto-merge is unavailable; waiting for pull request checks before squash merge."
            gh pr checks "$PR_NUMBER" --watch --interval 20
            gh pr merge --squash "$PR_NUMBER"
          fi
