name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: read

jobs:
  # Update VERSION file with tag version
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Update VERSION file
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          if-no-files-found: error
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Build Infinite Canvas
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-infinite-canvas-patches.mjs --root integrations/infinite-canvas
          cd integrations/infinite-canvas/web
          bun install --frozen-lockfile
          VITE_BASE=/canvas-app/ bun run typecheck
          VITE_BASE=/canvas-app/ bun run build
          cp ../VERSION dist/version.txt
          cd ../../..
          mkdir -p backend/internal/web/dist/canvas-app
          cp -a integrations/infinite-canvas/web/dist/. backend/internal/web/dist/canvas-app/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 1

  build-release:
    needs: [update-version, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      simple_release: ${{ steps.release.outputs.simple_release }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Download VERSION artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Read immutable release descriptor
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          SIMPLE_RELEASE_VALUE="${SIMPLE_RELEASE}"
          [[ "$TAG_NAME" == "v${VERSION}" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "simple_release=$SIMPLE_RELEASE_VALUE" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false

      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get tag message
        shell: bash
        run: |
          set -euo pipefail
          TAG_MESSAGE="$(git tag -l --format='%(contents:body)' "$TAG_NAME")"
          printf '%s' "$TAG_MESSAGE" > "$RUNNER_TEMP/tag-message.txt"

      - name: Set lowercase owner for GHCR
        id: lowercase
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts without publication credentials
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip

      - name: Verify and package release artifacts
        shell: bash
        env:
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/release-bundle"
          ASSET_DIR="$OUTPUT_DIR/assets"
          mkdir -p "$ASSET_DIR"
          IMAGE="ghcr.io/${GITHUB_REPO_OWNER_LOWER}/sub2api"

          if [[ "$SIMPLE_RELEASE" == "true" ]]; then
            RELEASE_TITLE="Sub2API ${VERSION} (Simple)"
            IMAGE_REFS=(
              "${IMAGE}:${VERSION}-amd64"
              "${IMAGE}:${VERSION}"
              "${IMAGE}:latest"
            )
          else
            RELEASE_TITLE="Sub2API ${VERSION}"
            for artifact in \
              "dist/sub2api_${VERSION}_linux_amd64.tar.gz" \
              "dist/sub2api_${VERSION}_linux_arm64.tar.gz" \
              "dist/sub2api_${VERSION}_windows_amd64.zip" \
              "dist/sub2api_${VERSION}_darwin_amd64.tar.gz" \
              "dist/sub2api_${VERSION}_darwin_arm64.tar.gz" \
              "dist/checksums.txt"; do
              test -s "$artifact" || { echo "Missing release artifact: $artifact" >&2; exit 1; }
            done
            cp dist/*.tar.gz dist/*.zip dist/checksums.txt "$ASSET_DIR/"
            (
              cd "$ASSET_DIR"
              sha256sum --check checksums.txt
            )
            IMAGE_REFS=(
              "${IMAGE}:${VERSION}-amd64"
              "${IMAGE}:${VERSION}-arm64"
            )
          fi

          for image_ref in "${IMAGE_REFS[@]}"; do
            docker image inspect "$image_ref" >/dev/null
          done
          printf '%s\n' "$RELEASE_TITLE" > "$ASSET_DIR/release-title.txt"
          cp "$RUNNER_TEMP/tag-message.txt" "$ASSET_DIR/tag-message.txt"
          cp deploy/DOCKER.md "$ASSET_DIR/DOCKER.md"

          if [[ "$SIMPLE_RELEASE" == "true" ]]; then
            printf '%s\n' \
              '> AI API Gateway Platform - 将 AI 订阅配额分发和管理' \
              '> ⚡ Simple Release: 仅包含 x86_64 GHCR 镜像' \
              '' > "$ASSET_DIR/release-notes.md"
          else
            printf '%s\n' \
              '> AI API Gateway Platform - 将 AI 订阅配额分发和管理' \
              '' > "$ASSET_DIR/release-notes.md"
          fi
          cat "$ASSET_DIR/tag-message.txt" >> "$ASSET_DIR/release-notes.md"
          {
            printf '\n---\n\n'
            printf '%s\n\n' '## 📥 Installation'
            if [[ "$SIMPLE_RELEASE" == "true" ]]; then
              printf '%s\n' '**Docker (x86_64 only):**' '```bash'
              printf 'docker pull %s:%s\n' "$IMAGE" "$VERSION"
              printf '%s\n\n' '```'
            else
              printf '%s\n' '**Docker:**' '```bash' '# GitHub Container Registry'
              printf 'docker pull %s:%s\n' "$IMAGE" "$VERSION"
              printf '%s\n\n' '```'
              printf '%s\n' '**One-line install (Linux):**' '```bash'
              printf 'curl -sSL https://raw.githubusercontent.com/%s/main/deploy/install.sh | sudo bash\n' "$GITHUB_REPOSITORY"
              printf '%s\n\n' '```'
              printf '%s\n\n' '**Manual download:**' 'Download the appropriate archive for your platform from the assets below.'
            fi
            printf '%s\n\n' '## 📚 Documentation'
            printf -- '- [GitHub Repository](https://github.com/%s)\n' "$GITHUB_REPOSITORY"
            if [[ "$SIMPLE_RELEASE" != "true" ]]; then
              printf -- '- [Installation Guide](https://github.com/%s/blob/main/deploy/README.md)\n' "$GITHUB_REPOSITORY"
            fi
          } >> "$ASSET_DIR/release-notes.md"

          {
            echo "TAG_NAME=$TAG_NAME"
            echo "VERSION=$VERSION"
            echo "RELEASE_COMMIT=$RELEASE_COMMIT"
            echo "SIMPLE_RELEASE=$SIMPLE_RELEASE"
            echo "GITHUB_REPO_OWNER_LOWER=$GITHUB_REPO_OWNER_LOWER"
          } > "$OUTPUT_DIR/release-descriptor.env"
          tar -czf "$OUTPUT_DIR/release-assets.tar.gz" -C "$ASSET_DIR" .
          docker save "${IMAGE_REFS[@]}" --output "$OUTPUT_DIR/release-images.tar"
          (
            cd "$OUTPUT_DIR"
            sha256sum release-assets.tar.gz release-images.tar release-descriptor.env > release-bundle.sha256
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-bundle
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG_NAME: ${{ needs.build-release.outputs.tag_name }}
      VERSION: ${{ needs.build-release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build-release.outputs.release_commit }}
      SIMPLE_RELEASE: ${{ needs.build-release.outputs.simple_release }}
      ASSET_DIR: /tmp/release-assets
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-bundle
          path: ${{ runner.temp }}/release-bundle

      - name: Verify and extract release bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-bundle"
          sha256sum --check release-bundle.sha256
          # shellcheck disable=SC1091
          source release-descriptor.env
          [[ "$TAG_NAME" == "${{ needs.build-release.outputs.tag_name }}" ]]
          [[ "$VERSION" == "${{ needs.build-release.outputs.version }}" ]]
          [[ "$RELEASE_COMMIT" == "${{ needs.build-release.outputs.release_commit }}" ]]
          [[ "$SIMPLE_RELEASE" == "${{ needs.build-release.outputs.simple_release }}" ]]
          mkdir -p "$ASSET_DIR"
          tar -xzf release-assets.tar.gz -C "$ASSET_DIR"
          test -s "$ASSET_DIR/release-title.txt"
          test -s "$ASSET_DIR/release-notes.md"
          test -f "$ASSET_DIR/tag-message.txt"
          docker load --input release-images.tar
          IMAGE="ghcr.io/${GITHUB_REPO_OWNER_LOWER}/sub2api"
          if [[ "$SIMPLE_RELEASE" == "true" ]]; then
            docker image inspect "${IMAGE}:${VERSION}-amd64" >/dev/null
            docker image inspect "${IMAGE}:${VERSION}" >/dev/null
            docker image inspect "${IMAGE}:latest" >/dev/null
          else
            docker image inspect "${IMAGE}:${VERSION}-amd64" >/dev/null
            docker image inspect "${IMAGE}:${VERSION}-arm64" >/dev/null
            (
              cd "$ASSET_DIR"
              sha256sum --check checksums.txt
            )
          fi

      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login to DockerHub
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        shell: bash
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish prebuilt container images
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPO_OWNER_LOWER}/sub2api"
          if [[ "$SIMPLE_RELEASE" == "true" ]]; then
            docker push "${IMAGE}:${VERSION}-amd64"
            docker push "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:latest"
            exit 0
          fi

          docker push "${IMAGE}:${VERSION}-amd64"
          docker push "${IMAGE}:${VERSION}-arm64"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          for tag in "$VERSION" latest "$MINOR" "$MAJOR"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          done

          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            docker tag "${IMAGE}:${VERSION}-amd64" "${DOCKERHUB_IMAGE}:${VERSION}-amd64"
            docker tag "${IMAGE}:${VERSION}-arm64" "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
            docker push "${DOCKERHUB_IMAGE}:${VERSION}-amd64"
            docker push "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
            for tag in "$VERSION" latest "$MINOR" "$MAJOR"; do
              docker buildx imagetools create \
                --tag "${DOCKERHUB_IMAGE}:${tag}" \
                "${DOCKERHUB_IMAGE}:${VERSION}-amd64" \
                "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
            done
          fi

      - name: Publish GitHub release from verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TITLE="$(cat "$ASSET_DIR/release-title.txt")"
          RELEASE_ASSETS=()
          if [[ "$SIMPLE_RELEASE" != "true" ]]; then
            while IFS= read -r asset; do
              RELEASE_ASSETS+=("$asset")
            done < <(find "$ASSET_DIR" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums.txt' \) -print | sort)
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${#RELEASE_ASSETS[@]}" -gt 0 ]]; then
              gh release upload "$TAG_NAME" "${RELEASE_ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file "$ASSET_DIR/release-notes.md" \
              --latest \
              --draft=false \
              --prerelease=false
          else
            gh release create "$TAG_NAME" "${RELEASE_ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file "$ASSET_DIR/release-notes.md" \
              --latest
          fi

      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON_FILE=/tmp/published-release.json
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,targetCommitish > "$RELEASE_JSON_FILE"
          [[ "$(jq -r '.isDraft' "$RELEASE_JSON_FILE")" == "false" ]]
          [[ "$(jq -r '.targetCommitish' "$RELEASE_JSON_FILE")" == "$RELEASE_COMMIT" ]]
          if [[ "$SIMPLE_RELEASE" != "true" ]]; then
            PUBLISHED_ASSETS="$(jq -r '.assets[].name' "$RELEASE_JSON_FILE")"
            for asset in \
              "sub2api_${VERSION}_linux_amd64.tar.gz" \
              "sub2api_${VERSION}_linux_arm64.tar.gz" \
              "sub2api_${VERSION}_windows_amd64.zip" \
              "sub2api_${VERSION}_darwin_amd64.tar.gz" \
              "sub2api_${VERSION}_darwin_arm64.tar.gz" \
              "checksums.txt"; do
              grep -Fqx -- "$asset" <<< "$PUBLISHED_ASSETS"
            done
          fi

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: /tmp/release-assets/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$(cat "$ASSET_DIR/tag-message.txt")"
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [publish-release]
    if: ${{ needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync VERSION file to released tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          CURRENT_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION || true)"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          gh auth setup-git
          git push origin HEAD:${{ github.event.repository.default_branch }}
